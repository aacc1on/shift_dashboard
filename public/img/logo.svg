<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- HUD-style corner brackets, matching the login screen's corner decorations -->
  <path d="M6 18 V8 a2 2 0 0 1 2-2 H18" stroke="#00ff88" stroke-width="4" stroke-linecap="round"/>
  <path d="M46 6 H56 a2 2 0 0 1 2 2 V18" stroke="#00ff88" stroke-width="4" stroke-linecap="round"/>
  <path d="M58 46 V56 a2 2 0 0 1 -2 2 H46" stroke="#00ff88" stroke-width="4" stroke-linecap="round"/>
  <path d="M18 58 H8 a2 2 0 0 1 -2-2 V46" stroke="#00ff88" stroke-width="4" stroke-linecap="round"/>

  <!-- 3x3 grid of connected nodes -->
  <g stroke="#00ff88" stroke-width="1.6" stroke-opacity="0.55">
    <line x1="20" y1="20" x2="44" y2="20"/>
    <line x1="20" y1="32" x2="44" y2="32"/>
    <line x1="20" y1="44" x2="44" y2="44"/>
    <line x1="20" y1="20" x2="20" y2="44"/>
    <line x1="32" y1="20" x2="32" y2="44"/>
    <line x1="44" y1="20" x2="44" y2="44"/>
  </g>
  <g fill="#00ff88">
    <circle cx="20" cy="20" r="3.4"/>
    <circle cx="32" cy="20" r="2.4"/>
    <circle cx="44" cy="20" r="3.4"/>
    <circle cx="20" cy="32" r="2.4"/>
    <circle cx="32" cy="32" r="4.2"/>
    <circle cx="44" cy="32" r="2.4"/>
    <circle cx="20" cy="44" r="3.4"/>
    <circle cx="32" cy="44" r="2.4"/>
    <circle cx="44" cy="44" r="3.4"/>
  </g>
</svg>
